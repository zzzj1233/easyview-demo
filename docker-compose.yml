name: easyview-demo

services:
  mysql:
    image: ${REG}mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
      TZ: Asia/Shanghai
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=128M --max-connections=100
    ports: ["23306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${REG}redis:7-alpine
    restart: unless-stopped
    ports: ["26379:6379"]
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --slowlog-log-slower-than 10000 --slowlog-max-len 128

  redis-exporter:
    image: ${REG}oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    depends_on: [redis]
    environment:
      REDIS_ADDR: redis://redis:6379
    ports: ["29121:9121"]

  sentinel-dashboard:
    image: docker.1ms.run/bladex/sentinel-dashboard:1.8.8
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard"
    ports: ["28858:8858"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  nacos:
    image: ${REG}nacos/nacos-server:v2.3.2
    restart: unless-stopped
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    ports:
      - "28848:8848"
      - "29848:9848"

  elasticsearch:
    image: ${REG}elasticsearch:7.17.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - TZ=Asia/Shanghai
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports: ["29200:9200"]
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -E 'green|yellow' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  sw-oap:
    image: ${REG}apache/skywalking-oap-server:9.7.0
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
      SW_CORE_RECORD_DATA_TTL: 3
      SW_CORE_METRICS_DATA_TTL: 3
      JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      - "21800:11800"
      - "22800:12800"

  sw-ui:
    image: ${REG}apache/skywalking-ui:9.7.0
    restart: unless-stopped
    depends_on: [sw-oap]
    environment:
      SW_OAP_ADDRESS: http://sw-oap:12800
      TZ: Asia/Shanghai
    ports: ["28180:8080"]

  prometheus:
    image: ${REG}prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./infra/prometheus:/etc/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
      - --storage.tsdb.retention.size=256MB
      - --web.enable-lifecycle
    ports: ["29090:9090"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: ${REG}prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./infra/alertmanager:/etc/alertmanager
    ports: ["29093:9093"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: ${REG}grafana/grafana:10.4.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DATABASE_WAL: "true"
      TZ: Asia/Shanghai
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    ports: ["23000:3000"]

volumes:
  mysql-data:
  es-data:
  grafana-data:
