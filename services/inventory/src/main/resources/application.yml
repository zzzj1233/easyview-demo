spring:
  application:
    name: inventory
  cloud:
    sentinel:
      transport:
        dashboard: localhost:28858
        port: 8721
        client-ip: 172.18.0.1
      eager: true
      web-context-unify: false
  datasource:
    url: jdbc:mysql://localhost:23306/demo?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

server:
  port: 28082
  tomcat:
    threads:
      max: 50
    accept-count: 50

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

dubbo:
  application:
    name: inventory
    qos-enable: false
  registry:
    address: nacos://localhost:28848
  protocol:
    name: dubbo
    port: 20882
  provider:
    timeout: 3000
    threads: 200
  metrics:
    enable-jvm-metrics: false
    aggregation:
      enabled: true
    histogram:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.jdbc: WARN
    org.apache.dubbo: WARN
