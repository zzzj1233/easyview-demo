spring:
  application:
    name: order
  datasource:
    url: jdbc:mysql://localhost:23306/demo?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: localhost
      port: 26379
      timeout: 1s

client:
  inventory:
    url: http://localhost:28082

server:
  port: 28081
  tomcat:
    threads:
      max: 50
    accept-count: 50

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    org.springframework.jdbc: WARN
    com.demo.order: INFO
