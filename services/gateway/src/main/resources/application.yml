spring:
  application:
    name: gateway
  cloud:
    sentinel:
      transport:
        dashboard: localhost:28858
        port: 8719
        client-ip: 172.18.0.1
      eager: true
      web-context-unify: false

dubbo:
  application:
    name: gateway
    qos-enable: false
  registry:
    address: nacos://localhost:28848
  protocol:
    name: dubbo
    port: 20880
  consumer:
    timeout: 3000
    retries: 1
    check: false
  metrics:
    enable-jvm-metrics: false
    aggregation:
      enabled: true
    histogram:
      enabled: true

server:
  port: 28080
  tomcat:
    threads:
      max: 50
    accept-count: 50

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.demo.gateway: INFO
    ALERT: WARN
